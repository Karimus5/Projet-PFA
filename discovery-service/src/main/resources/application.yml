server:
  port: 8761

spring:
  application:
    name: discovery-service
  config:
    # Récupère la configuration centralisée (config-repo/discovery-service.yml).
    # "optional:" : Eureka démarre quand même si le Config Server est injoignable.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Le serveur Eureka ne s'enregistre pas auprès de lui-même (instance unique).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
