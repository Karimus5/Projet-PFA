# Configuration utilisée UNIQUEMENT par les tests : ce fichier remplace src/main/resources/application.yml
# (il est trouvé en premier dans le classpath de test).
# Pas de Config Server ni d'Eureka : on charge directement le vrai fichier de routes/CORS du config-repo
# (Maven exécute les tests depuis le dossier du module, d'où le ../).

server:
  port: 0

spring:
  application:
    name: api-gateway
  config:
    import: file:../config-repo/api-gateway.yml
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
