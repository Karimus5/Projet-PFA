# Docker Compose sert UNIQUEMENT à l'infrastructure (bases de données, broker de messages).
# Les services Java/Python/React se lancent hors conteneur (mvn spring-boot:run, IDE, uvicorn, npm).
#
# Démarrer :  docker compose up -d
# Arrêter   :  docker compose down        (les données sont conservées dans le volume)
# Tout effacer : docker compose down -v   (supprime aussi les données)
#
# Les variables sont lues depuis le fichier .env (copier .env.example en .env).

name: reclamations

services:

  postgres:
    image: postgres:16-alpine
    container_name: reclamations-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RabbitMQ sera ajouté ici lors de l'étape notification-service / stats-service.

volumes:
  postgres-data:
