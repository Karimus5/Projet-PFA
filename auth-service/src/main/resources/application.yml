server:
  port: 8081

spring:
  application:
    # Nom d'enregistrement Eureka : doit correspondre à lb://auth-service dans la gateway.
    name: auth-service
  config:
    import:
      # Base de données, JWT, admin initial : config-repo/auth-service.yml + config-repo/application.yml.
      # Non optionnel : sans sa configuration, le service ne peut pas fonctionner.
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      # Secrets locaux (JWT_SECRET, POSTGRES_*, ADMIN_*) lus depuis le .env à la racine du monorepo :
      # ../.env quand on lance depuis le module (mvnw), ./.env depuis l'IDE (racine).
      # Les variables d'environnement du système restent prioritaires sur ce fichier.
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
