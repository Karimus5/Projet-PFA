# Configuration centralisée de l'API Gateway (port 8080).
# Les noms après lb:// sont les noms d'enregistrement Eureka (spring.application.name) des services.
# Le chemin est transmis tel quel : /api/claims/42 arrive sur claim-service en /api/claims/42.
# Si aucune instance n'est enregistrée dans Eureka, la passerelle répond 503 (Service Unavailable).

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: claim-service
              uri: lb://claim-service
              predicates:
                - Path=/api/claims/**
            - id: stats-service
              uri: lb://stats-service
              predicates:
                - Path=/api/stats/**

          # Évite les en-têtes CORS en double si un service en aval en ajoute aussi.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          # CORS géré UNIQUEMENT à la passerelle, pour le frontend React
          # (3000 = Create React App, 5173 = Vite).
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - http://localhost:3000
                  - http://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - X-Requested-With
                exposed-headers:
                  - Location
                  - Content-Disposition
                allow-credentials: true
                max-age: 3600

# Contrôle d'accès à la passerelle (JWT HS256 vérifié avec security.jwt.* de application.yml).
# - Les requêtes OPTIONS (pré-requêtes CORS) sont toujours publiques.
# - public-routes : accessibles sans jeton. method facultatif (toutes méthodes si absent).
# - role-rules    : jeton valide ET l'un des rôles listés (sinon 403). Évaluées dans l'ordre,
#                   la première règle dont le chemin correspond s'applique.
# - Tout le reste : jeton valide exigé (sinon 401).
# Les services en aval gardent leurs propres contrôles (défense en profondeur).
gateway:
  security:
    public-routes:
      - method: POST
        path: /api/auth/register
      - method: POST
        path: /api/auth/login
      - method: GET
        path: /actuator/health/**
    role-rules:
      - path: /api/auth/admin/**
        roles: [ADMIN]
      # claim-service : administration des référentiels, et listes déroulantes (agents / admins).
      # Le reste de /api/claims/** exige seulement un jeton valide : claim-service applique
      # lui-même les règles fines (rôle + visibilité de chaque réclamation).
      - path: /api/claims/admin/**
        roles: [ADMIN]
      - path: /api/claims/categories/**
        roles: [AGENT, ADMIN]
      - path: /api/claims/services/**
        roles: [AGENT, ADMIN]
      # Règles prévues pour les prochains services (décommenter au moment de leur création) :
      # - path: /api/stats/**
      #   roles: [AGENT, ADMIN]

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: api-gateway
    description: Point d'entrée unique de la plateforme de gestion des réclamations
