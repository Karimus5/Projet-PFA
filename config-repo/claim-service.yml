# Configuration centralisée de claim-service (port 8082).
# Les ${...} sont résolus côté claim-service, depuis les variables d'environnement ou le fichier .env.
#
# SÉCURITÉ : claim-service ne revalide PAS le JWT. Il identifie l'appelant avec les en-têtes
# X-User-Id / X-User-Email / X-User-Role posés par l'api-gateway (qui supprime ceux envoyés par
# le client). Le port 8082 ne doit donc JAMAIS être exposé directement : seule la gateway l'est.

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/claim_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré UNIQUEMENT par Flyway (src/main/resources/db/migration).
      ddl-auto: validate
    properties:
      hibernate:
        # Charge catégories / services des listes paginées par lots (évite le N+1).
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      # Le contrôle métier (5 Mo par fichier, 5 fichiers par réclamation) est fait par
      # AttachmentService ; ces limites techniques ne servent que de garde-fou.
      max-file-size: 5MB
      max-request-size: 26MB

server:
  tomcat:
    # Laisse Tomcat lire la fin d'un envoi trop gros pour pouvoir renvoyer l'erreur JSON.
    max-swallow-size: 30MB

claims:
  attachments:
    # Dossier de stockage des pièces jointes, HORS du dépôt Git (créé au besoin).
    storage-dir: ${CLAIMS_STORAGE_DIR:${user.home}/reclamations-data/attachments}
    max-file-size: 5MB
    max-files-per-claim: 5

# --- Classement automatique par le service IA (BF16-BF19, étape 7a) ---------------------------
# Appel REST (OpenFeign) de ai-classifier-service à la création d'une réclamation, APRÈS son
# enregistrement. Pas de découverte Eureka : URL fixe (le service IA écoute sur 127.0.0.1).
# Toute panne (délai, erreur, service arrêté, disjoncteur ouvert) laisse la réclamation en NEW
# (classement manuel) : la création n'échoue jamais à cause de l'IA.
ai-classifier:
  enabled: true
  url: ${AI_SERVICE_URL:http://localhost:8000}
  # Clé partagée avec le service IA (en-tête X-API-Key). Vide → classement automatique désactivé.
  api-key: ${AI_SERVICE_API_KEY:}
  # 2 s au total au maximum (exigence : classification en moins de 2 s), aucune nouvelle tentative.
  connect-timeout: 500ms
  read-timeout: 1500ms

# Disjoncteur devant le service IA : sur les 5 derniers appels (au moins 3), si 50 % ou plus ont
# échoué, il s'OUVRE : les créations suivantes ne tentent plus l'appel (repli immédiat) pendant
# 30 s, puis un seul appel d'essai est autorisé (s'il réussit, le disjoncteur se referme).
# Une confiance basse n'est pas un échec : seules les erreurs techniques comptent.
resilience4j:
  circuitbreaker:
    instances:
      ai-classifier:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
        # L'état du disjoncteur ne doit pas rendre claim-service « DOWN » dans /actuator/health.
        register-health-indicator: false
