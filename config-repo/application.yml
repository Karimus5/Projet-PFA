# Configuration partagée par TOUS les services clients du Config Server.
# Un fichier <nom-du-service>.yml dans ce dossier surcharge ces valeurs pour un service donné.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
